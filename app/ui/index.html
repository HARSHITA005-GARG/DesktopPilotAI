<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Voice Agent</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #status-text {
            position: absolute;
            bottom: 10%;
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.7;
            transition: opacity 0.3s;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="status-text">SYSTEM IDLE</div>

    <script>
        // --- 1. Three.js Scene Setup ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        camera.position.z = 3;

        // --- 2. The Siri Globe Shader Material ---
        // This creates the shifting, organic blob effect
        const geometry = new THREE.IcosahedronGeometry(1, 64);
        
        const vertexShader = `
            varying vec2 vUv;
            varying vec3 vPosition;
            uniform float uTime;
            uniform float uIntensity;
            
            // Simplex noise function
            vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
            vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
            float snoise(vec3 v) { 
                const vec2  C = vec2(1.0/6.0, 1.0/3.0) ;
                const vec4  D = vec4(0.0, 0.5, 1.0, 2.0);
                vec3 i  = floor(v + dot(v, C.yyy) );
                vec3 x0 = v - i + dot(i, C.xxx) ;
                vec3 g = step(x0.yzx, x0.xyz);
                vec3 l = 1.0 - g;
                vec3 i1 = min( g.xyz, l.zxy );
                vec3 i2 = max( g.xyz, l.zxy );
                vec3 x1 = x0 - i1 + C.xxx;
                vec3 x2 = x0 - i2 + C.yyy; // 2.0*C.x = 1/3 = C.y
                vec3 x3 = x0 - D.yyy;      // -1.0+3.0*C.x = -0.5 = -D.y
                i = mod289(i); 
                vec4 p = permute( permute( permute( 
                            i.z + vec4(0.0, i1.z, i2.z, 1.0 ))
                        + i.y + vec4(0.0, i1.y, i2.y, 1.0 )) 
                        + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
                float n_ = 0.142857142857; // 1.0/7.0
                vec3  ns = n_ * D.wyz - D.xzx;
                vec4 j = p - 49.0 * floor(p * ns.z * ns.z);  //  mod(p,7*7)
                vec4 x_ = floor(j * ns.z);
                vec4 y_ = floor(j - 7.0 * x_ );    // mod(j,N)
                vec4 x = x_ *ns.x + ns.yyyy;
                vec4 y = y_ *ns.x + ns.yyyy;
                vec4 h = 1.0 - abs(x) - abs(y);
                vec4 b0 = vec4( x.xy, y.xy );
                vec4 b1 = vec4( x.zw, y.zw );
                vec4 s0 = floor(b0)*2.0 + 1.0;
                vec4 s1 = floor(b1)*2.0 + 1.0;
                vec4 sh = -step(h, vec4(0.0));
                vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
                vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;
                vec3 p0 = vec3(a0.xy,h.x);
                vec3 p1 = vec3(a0.zw,h.y);
                vec3 p2 = vec3(a1.xy,h.z);
                vec3 p3 = vec3(a1.zw,h.w);
                vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
                p0 *= norm.x;
                p1 *= norm.y;
                p2 *= norm.z;
                p3 *= norm.w;
                vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                m = m * m;
                return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
            }

            void main() {
                vUv = uv;
                vPosition = position;
                // Deform the sphere using noise
                float noise = snoise(vec3(position.x * 2.0 + uTime, position.y * 2.0 + uTime, position.z * 2.0));
                vec3 newPosition = position + normal * (noise * uIntensity);
                gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
            }
        `;

        const fragmentShader = `
            varying vec2 vUv;
            uniform vec3 uColor1;
            uniform vec3 uColor2;

            void main() {
                // Mix two colors based on the UV coordinates to create a gradient
                vec3 finalColor = mix(uColor1, uColor2, vUv.y);
                // Add a subtle glow/fade to the edges
                float glow = 1.0 - distance(vUv, vec2(0.5));
                gl_FragColor = vec4(finalColor * glow * 1.5, 0.8);
            }
        `;

        const material = new THREE.ShaderMaterial({
            vertexShader,
            fragmentShader,
            uniforms: {
                uTime: { value: 0 },
                uIntensity: { value: 0.15 }, 
                uColor1: { value: new THREE.Color('#333333') }, 
                uColor2: { value: new THREE.Color('#000000') }
            },
            transparent: true,
            wireframe: false // <--- Set this to false for a solid orb
        });

        const globe = new THREE.Mesh(geometry, material);
        scene.add(globe);

        // --- 3. Animation & Color States ---
        const states = {
            idle: { 
                color1: '#444444', color2: '#111111', intensity: 0.05, speed: 0.01 
            },
            listening: { 
                color1: '#00ffcc', color2: '#0066ff', intensity: 0.15, speed: 0.03 // Teal/Blue
            },
            thinking: { 
                color1: '#ff00ff', color2: '#6600ff', intensity: 0.3, speed: 0.05 // Purple/Pink pulse
            },
            speaking: { 
                color1: '#ffcc00', color2: '#ff3300', intensity: 0.2, speed: 0.04 // Orange/Yellow
            }
        };

        let currentState = states.idle;
        const statusText = document.getElementById('status-text');

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            globe.rotation.y += currentState.speed;
            globe.rotation.x += currentState.speed * 0.5;
            
            // Smoothly interpolate current uniforms towards the target state
            material.uniforms.uTime.value += currentState.speed;
            material.uniforms.uIntensity.value += (currentState.intensity - material.uniforms.uIntensity.value) * 0.05;
            material.uniforms.uColor1.value.lerp(new THREE.Color(currentState.color1), 0.05);
            material.uniforms.uColor2.value.lerp(new THREE.Color(currentState.color2), 0.05);

            renderer.render(scene, camera);
        }
        animate();

        // --- 4. WebSocket Connection ---
        const ws = new WebSocket("ws://127.0.0.1:8000/ws");
        
        ws.onmessage = function(event) {
            const status = event.data;
            statusText.innerText = "SYSTEM " + status;
            
            if (states[status]) {
                currentState = states[status];
            }
        };

        ws.onclose = () => {
            statusText.innerText = "DISCONNECTED";
            currentState = states.idle;
        };

        // Handle Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
