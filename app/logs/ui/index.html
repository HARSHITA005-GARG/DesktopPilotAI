<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentic Siri UI</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #030303; /* Deep space black */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #status-text {
            position: absolute;
            bottom: 8%;
            font-size: 0.85rem;
            letter-spacing: 6px;
            font-weight: 400;
            text-transform: uppercase;
            color: #ffffff;
            opacity: 0.4;
            transition: opacity 0.5s ease-in-out, transform 0.3s ease;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="status-text">SYSTEM IDLE</div>

    <script>
        // --- 1. Scene Setup ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
        document.body.appendChild(renderer.domElement);

        camera.position.z = 2.5;

        // PERFECTLY smooth sphere. No bumps.
        const geometry = new THREE.SphereGeometry(1.0, 128, 128);
        
        // --- 2. The Internal Volumetric Shader ---
        const vertexShader = `
            varying vec3 vNormal;
            varying vec3 vPosition;
            varying vec3 vWorldPosition;

            void main() {
                vNormal = normalize(normalMatrix * normal);
                vPosition = position;
                vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                vWorldPosition = worldPosition.xyz;
                
                // NO displacement. Keep it perfectly round.
                gl_Position = projectionMatrix * viewMatrix * worldPosition;
            }
        `;

        const fragmentShader = `
            varying vec3 vNormal;
            varying vec3 vPosition;
            varying vec3 vWorldPosition;
            
            uniform float uTime;
            uniform vec3 uColor1; // Cyan
            uniform vec3 uColor2; // Magenta
            uniform vec3 uColor3; // Purple
            uniform float uSpeed;

            // Simplex 3D Noise
            vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
            vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
            float snoise(vec3 v) { 
                const vec2  C = vec2(1.0/6.0, 1.0/3.0);
                const vec4  D = vec4(0.0, 0.5, 1.0, 2.0);
                vec3 i  = floor(v + dot(v, C.yyy));
                vec3 x0 = v - i + dot(i, C.xxx);
                vec3 g = step(x0.yzx, x0.xyz);
                vec3 l = 1.0 - g;
                vec3 i1 = min( g.xyz, l.zxy );
                vec3 i2 = max( g.xyz, l.zxy );
                vec3 x1 = x0 - i1 + C.xxx;
                vec3 x2 = x0 - i2 + C.yyy; 
                vec3 x3 = x0 - D.yyy;      
                i = mod289(i); 
                vec4 p = permute( permute( permute( 
                            i.z + vec4(0.0, i1.z, i2.z, 1.0 ))
                        + i.y + vec4(0.0, i1.y, i2.y, 1.0 )) 
                        + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
                float n_ = 0.142857142857; 
                vec3  ns = n_ * D.wyz - D.xzx;
                vec4 j = p - 49.0 * floor(p * ns.z * ns.z);  
                vec4 x_ = floor(j * ns.z);
                vec4 y_ = floor(j - 7.0 * x_ );    
                vec4 x = x_ *ns.x + ns.yyyy;
                vec4 y = y_ *ns.x + ns.yyyy;
                vec4 h = 1.0 - abs(x) - abs(y);
                vec4 b0 = vec4( x.xy, y.xy );
                vec4 b1 = vec4( x.zw, y.zw );
                vec4 s0 = floor(b0)*2.0 + 1.0;
                vec4 s1 = floor(b1)*2.0 + 1.0;
                vec4 sh = -step(h, vec4(0.0));
                vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
                vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;
                vec3 p0 = vec3(a0.xy,h.x);
                vec3 p1 = vec3(a0.zw,h.y);
                vec3 p2 = vec3(a1.xy,h.z);
                vec3 p3 = vec3(a1.zw,h.w);
                vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
                p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
                vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                m = m * m;
                return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
            }

            void main() {
                // 1. The Dark Base (Matches the outer edges of the Siri orb)
                vec3 baseColor = vec3(0.08, 0.05, 0.15); 

                // 2. Generate 3 distinct internal noise layers moving in different directions
                vec3 p = vPosition * 1.8;
                float time = uTime * uSpeed;
                
                float n1 = snoise(p + vec3(time, 0.0, 0.0));
                float n2 = snoise(p + vec3(0.0, time * 0.8, 0.0));
                float n3 = snoise(p + vec3(0.0, 0.0, time * 1.2));

                // 3. Convert noise into distinct "Bands" or "Ribbons" using sine waves
                float wave1 = pow(sin(n1 * 3.14) * 0.5 + 0.5, 2.0);
                float wave2 = pow(sin(n2 * 3.14) * 0.5 + 0.5, 2.0);
                float wave3 = pow(sin(n3 * 3.14) * 0.5 + 0.5, 2.0);

                // 4. Mix the Ribbons together
                vec3 colorMix = baseColor;
                colorMix += uColor1 * wave1 * 1.2;
                colorMix += uColor2 * wave2 * 1.2;
                colorMix += uColor3 * wave3 * 1.2;

                // 5. The Hot Glowing Core (White/Pink center)
                // We calculate distance from the center of the screen
                float centerDist = length(vPosition.xy); 
                float coreGlow = 1.0 - smoothstep(0.0, 0.7, centerDist);
                colorMix += vec3(1.0, 0.9, 0.95) * pow(coreGlow, 2.5); // Bright inner flash

                // 6. Glass Edge Darkening (Fresnel Effect)
                vec3 cameraToVertex = normalize(vWorldPosition - cameraPosition);
                float rimLight = 1.0 + dot(cameraToVertex, vNormal);
                rimLight = smoothstep(0.0, 1.0, rimLight);
                
                // Darken the edges to make it look contained inside a glass sphere
                colorMix = mix(colorMix, vec3(0.02, 0.01, 0.05), rimLight * 0.8);

                gl_FragColor = vec4(colorMix, 1.0);
            }
        `;

        const material = new THREE.ShaderMaterial({
            vertexShader,
            fragmentShader,
            uniforms: {
                uTime: { value: 0 },
                uSpeed: { value: 1.0 },
                // Default Siri Colors
                uColor1: { value: new THREE.Color('#00f0ff') }, // Cyan
                uColor2: { value: new THREE.Color('#ff0055') }, // Magenta
                uColor3: { value: new THREE.Color('#5500ff') }  // Purple
            }
        });

        const orb = new THREE.Mesh(geometry, material);
        scene.add(orb);

        // --- 3. UI States (Matching the Siri aesthetic per action) ---
        const states = {
            idle: { 
                speed: 0.2, // Very slow breathing
                c1: '#003344', c2: '#330022', c3: '#110033' // Dimmed versions
            },
            listening: { 
                speed: 1.2, // Active swirling
                c1: '#00f0ff', c2: '#ff0055', c3: '#5500ff' // The Classic Siri look
            },
            thinking: { 
                speed: 1.8, // Faster computing
                c1: '#b224ef', c2: '#7579ff', c3: '#00f0ff' // Deep Purples & Cyans
            },
            "executing tool": {
                speed: 2.0,
                c1: '#00f0ff', c2: '#00ff88', c3: '#7579ff'
            },
            "executing docker command": {
                speed: 2.2,
                c1: '#2496ed', c2: '#00f0ff', c3: '#ffffff'
            },
            "searching web": {
                speed: 1.7,
                c1: '#00ff88', c2: '#00f0ff', c3: '#7579ff'
            },
            "writing file": {
                speed: 1.6,
                c1: '#ffcc00', c2: '#ff5e00', c3: '#00f0ff'
            },
            "updating file": {
                speed: 1.8,
                c1: '#ffcc00', c2: '#ff0073', c3: '#7579ff'
            },
            "reading file": {
                speed: 1.4,
                c1: '#00f0ff', c2: '#7579ff', c3: '#b224ef'
            },
            "creating document": {
                speed: 1.5,
                c1: '#2496ed', c2: '#ffffff', c3: '#7579ff'
            },
            calculating: {
                speed: 1.8,
                c1: '#00ff88', c2: '#ffcc00', c3: '#00f0ff'
            },
            "saving memory": {
                speed: 1.2,
                c1: '#b224ef', c2: '#ff0073', c3: '#7579ff'
            },
            speaking: { 
                speed: 1.0,
                c1: '#ff5e00', c2: '#ff0073', c3: '#ffcc00' // Warm Oranges & Pinks
            }
        };

        let currentState = states.idle;
        const statusText = document.getElementById('status-text');
        let time = 0;

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;
            
            orb.rotation.y += 0.005;
            orb.rotation.z += 0.002;
            
            material.uniforms.uTime.value = time;
            
            // Smoothly interpolate speeds and colors based on state
            material.uniforms.uSpeed.value += (currentState.speed - material.uniforms.uSpeed.value) * 0.05;
            material.uniforms.uColor1.value.lerp(new THREE.Color(currentState.c1), 0.05);
            material.uniforms.uColor2.value.lerp(new THREE.Color(currentState.c2), 0.05);
            material.uniforms.uColor3.value.lerp(new THREE.Color(currentState.c3), 0.05);

            renderer.render(scene, camera);
        }
        animate();

        // --- 4. WebSocket Connection ---
        const ws = new WebSocket("ws://127.0.0.1:8000/ws");
        
        ws.onmessage = function(event) {
            const status = event.data;
            statusText.innerText = "SYSTEM " + status;
            
            if (states[status]) {
                currentState = states[status];
                
                // UI Text Pop effect
                if (status !== 'idle') {
                    statusText.style.opacity = "0.8";
                    statusText.style.transform = "scale(1.05)";
                    setTimeout(() => {
                        statusText.style.transform = "scale(1)";
                        statusText.style.opacity = "0.4";
                    }, 300);
                }
            }
        };

        ws.onclose = () => {
            statusText.innerText = "DISCONNECTED";
            currentState = states.idle;
        };

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
